</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script>/* SHIELD review prototype. Remote participants and AI scores are synthetic. */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem('shield-'+k))??f}catch{return f}}, save=(k,v)=>{try{localStorage.setItem('shield-'+k,JSON.stringify(v))}catch{toast('이 브라우저에서는 저장할 수 없습니다.')}};
const logo=()=>`<div class="logo"><span class="logo-mark"><svg width="23" height="25" viewBox="0 0 24 26" fill="none" aria-hidden="true"><path d="M12 2 21 6v7c0 5-6 9-9 11C9 22 3 18 3 13V6l9-4Z" stroke="currentColor" stroke-width="1.7"/><path d="m7.5 12 3 3 6-6" stroke="currentColor" stroke-width="1.7"/></svg></span><div><b>SHIELD</b><small>REALTIME TRUST</small></div></div>`;
const initialPeople=()=>[{id:1,name:S.profile.name,score:18,audio:14,visual:22,mic:true,camera:true,host:S.role==='host',speaking:true},{id:2,name:'박서윤',score:72,audio:68,visual:76,mic:true,camera:true},{id:3,name:'이지현',score:46,audio:42,visual:50,mic:false,camera:true},{id:4,name:'최다니엘',score:12,audio:10,visual:14,mic:true,camera:false}];
const S={page:'login',profile:load('profile',{name:'김민준',email:'name@example.com'}),schedules:load('schedules',[]),role:'host',meeting:null,people:[],tab:'people',mic:true,camera:true,bg:'none',messages:[],waiting:[{id:5,name:'정하린'}],records:[],live:null,share:null,recorder:null,recording:false,network:'online',alert:true,window:1,history:[21,24,29,43,48,55,64,72],devices:{audio:'',video:''},timer:null};

S.profile={...S.profile,id:S.profile.id||'demo-account',loginId:S.profile.loginId||'shield-demo'};
S.accounts=load('accounts-v3',[]);if(!S.accounts.some(x=>x.id==='demo-account'))S.accounts.unshift({...S.profile,id:'demo-account',loginId:'shield-demo'});
S.closedMeetings=load('closed-meetings-v3',[]);S.removedPeople=[];S.tabId=globalThis.crypto?.randomUUID?.()||String(Math.random());

let modalClose=null,previousFocus=null;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').style.display='none',3500)}
function modal(html,wide=false,onClose=null){if($('#modal-root').innerHTML)closeModal();previousFocus=document.activeElement;modalClose=onClose;$('#modal-root').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;document.body.style.overflow='hidden';$('.modal input,.modal button,.modal select')?.focus()}
function closeModal(){const cb=modalClose;modalClose=null;$('#modal-root').innerHTML='';document.body.style.overflow='';cb?.();previousFocus?.focus?.()}
function modalHead(eyebrow,title){return `<div class="row between"><div><div class="eyebrow">${eyebrow}</div><h2 id="modal-title">${title}</h2></div><button class="close" data-action="close" aria-label="닫기">×</button></div>`}
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const els=[...$('.modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function login(signup=false){S.page='login';$('#app').innerHTML=`<main class="login"><div class="login-inner">${logo()}<section class="panel"><div class="eyebrow">Secure video meetings</div><h1>${signup?'신뢰할 수 있는<br>대화의 시작.':'안전한 회의를<br>시작하세요.'}</h1><p>${signup?'이메일로 가입하고, 사용자 아이디로 초대받으세요.':'이메일 또는 사용자 아이디로 로그인하세요.'}</p><form id="auth-form" data-signup="${signup}"><label>${signup?'이메일':'이메일 또는 사용자 아이디'}<input name="${signup?'email':'identifier'}" type="${signup?'email':'text'}" required maxlength="254" placeholder="${signup?'name@example.com':'name@example.com 또는 minjun_01'}" autocomplete="${signup?'email':'username'}" autocapitalize="none" spellcheck="false"></label>${signup?'<label>사용자 아이디 · 로그인·초대용<input name="loginId" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_-]{3,30}" placeholder="예: minjun_01" autocomplete="username"></label><small>영문·숫자·_·-로 3~30자, 회원별로 고유합니다.</small><label>닉네임<input name="name" required maxlength="20" placeholder="회의에 표시할 이름 · 중복 가능" autocomplete="nickname"></label><small>이메일과 사용자 아이디는 중복 불가, 닉네임은 중복 가능합니다.</small>':''}<label>비밀번호<input name="password" type="password" required minlength="8" placeholder="8자 이상" autocomplete="${signup?'new-password':'current-password'}"></label><div id="auth-error" class="error" role="alert"></div><button class="primary full" style="margin-top:23px">${signup?'데모 계정 만들기':'로그인 체험'}</button></form><div class="divider">또는</div><button class="full ghost" data-action="demo-login">데모 계정으로 시작하기</button><p style="text-align:center;margin-top:20px"><button class="link" data-action="${signup?'login':'signup'}">${signup?'로그인으로':'회원가입'}</button></p></section><p class="note">UI 체험용 데모 · 계정은 이 브라우저에 저장됩니다. 실제 개인정보·비밀번호 대신 예시 값을 입력하세요. 비밀번호는 저장·검증하지 않습니다. 이번 MVP는 이메일 인증 없이 가입합니다. 인증 도입 여부는 추후 협의합니다.</p></div></main>`}
function header(){return `<header class="header">${logo()}<div class="row"><span class="demo-badge">INTERACTIVE DEMO</span><button class="ghost row" data-action="profile"><span>${esc(S.profile.name)}</span><span class="avatar">${esc(S.profile.name[0])}</span></button></div></header>`}
function dashboard(){S.page='dashboard';$('#app').innerHTML=`${header()}<main class="container"><section class="hero"><div class="eyebrow">Your meeting room</div><h1>회의를 만들고,<br><span class="muted">안심하고 대화하세요.</span></h1><p>대화에 집중하세요. SHIELD가 신뢰의 신호를 살핍니다.</p></section><div class="cards"><button class="action-card" data-action="create"><div class="row between"><span class="icon-box">＋</span><span>↗</span></div><h2>새 회의 시작</h2><p>지금 시작하거나, 다음 회의를 예약하세요.</p></button><button class="action-card" data-action="join"><div class="row between"><span class="icon-box" style="background:#ffffff0b;color:#ccc">↗</span><span>→</span></div><h2>회의 참여</h2><p>초대 링크로 간편하게 참여합니다.</p></button></div><div class="section-title"><h2>예정된 회의 <small> / ${mySchedules().length}</small></h2><button class="ghost" data-action="schedule" style="font-size:11px">＋ 회의 예약</button></div>${mySchedules().length?mySchedules().map(m=>`<div class="panel schedule" style="margin-bottom:10px"><div class="datebox"><small>${new Date(m.date).getMonth()+1}월</small>${new Date(m.date).getDate()}</div><div><strong>${esc(m.title)}</strong><div><small>${esc(m.date.replace('T',' · '))} · Asia/Seoul · 초대 ${m.invites.length}명</small></div><div class="chips"><span class="pill safe">예약 완료</span><small>${esc(m.access)} · 대기실 ${m.waiting?'사용':'미사용'}</small></div></div><button data-action="schedule-info" data-id="${m.id}">회의 정보</button></div>`).join(''):'<div class="panel empty">예정된 회의가 없습니다. 다음 보안 검토 회의를 예약해 보세요.</div>'}<div class="section-title"><h2>녹화 보관함 <small> / ${myRecords().length}</small></h2><button class="ghost" data-action="records" style="font-size:11px">보관함 열기 →</button></div><div class="panel row between"><div><div style="font-size:13px">회의가 끝나도, 필요한 기록은 안전하게.</div><small>직접 녹화한 파일을 미리 보고 다운로드하세요.</small></div><span class="icon-box" style="background:#ffffff08;color:#888">▣</span></div><p class="note">체험 안내 · 원격 참가자와 위험 점수는 예시 데이터입니다. 녹화·장치 사용은 브라우저 권한이 필요하며, 녹화 파일은 개인 보관함에서 저장 상태를 확인하고 다운로드할 수 있습니다.</p></main>`}
function profile(){modal(`${modalHead('Your account','프로필 및 회의 환경')}<form id="profile-form"><label>사용자 아이디 · 로그인·초대용<input readonly value="${esc(S.profile.loginId)}" aria-label="사용자 아이디"></label><label>닉네임<input name="name" value="${esc(S.profile.name)}" required maxlength="20"></label><label>이메일<input name="email" value="${esc(S.profile.email)}" type="email" required></label><p class="note">이메일과 사용자 아이디는 로그인·초대·검색, 닉네임은 회의·채팅 표시에 사용됩니다. 닉네임은 중복 가능합니다. 이메일 변경 시 로그인 주소도 변경됩니다.</p><div class="modal-footer"><button type="button" class="ghost" data-action="logout">로그아웃</button><button class="primary">변경 사항 저장</button></div></form>`)}
let draft=null;
function create(scheduled=false){draft={title:'제품 보안 검토 회의',scheduled,invites:[],access:'초대받은 사람만',waiting:true,mic:true,camera:true};createView()}
function createView(){modal(`${modalHead('Create meeting','새 회의 시작')}<div class="tabs"><button data-action="create-now" class="${!draft.scheduled?'active':''}">즉시 회의</button><button data-action="create-later" class="${draft.scheduled?'active':''}">예약 회의</button></div><form id="create-form"><label>회의 이름<input id="meeting-title" name="title" value="${esc(draft.title)}" required maxlength="80"></label>${draft.scheduled?`<div class="field-grid"><label>날짜 · 시간 (한국 표준시)<input name="date" type="datetime-local" required value="${esc(draft.date||futureDate())}"></label><label>예상 시간<select name="duration">${['30분','60분','90분'].map(t=>`<option ${t===(draft.duration||'60분')?'selected':''}>${t}</option>`).join('')}</select></label></div>`:''}<label>회의 공개 범위<select id="access" name="access"><option ${draft.access==='초대받은 사람만'?'selected':''}>초대받은 사람만</option><option ${draft.access==='링크가 있는 사람'?'selected':''}>링크가 있는 사람</option></select></label><label>이메일 또는 사용자 아이디로 초대</label><div class="row"><input id="invite-input" placeholder="name@example.com 또는 사용자 아이디" maxlength="100" style="margin:0"><button type="button" data-action="add-invite">추가</button></div><div id="invites" class="chips">${inviteChips()}</div><small>예시 회원: seoyun · seoyun@example.com / jihyun · jihyun@example.com</small><div class="option"><div>대기실 사용<br><small>호스트가 입장을 승인합니다.</small></div><input name="waiting" type="checkbox" ${draft.waiting?'checked':''} aria-label="대기실 사용"></div><div class="field-grid"><label><input name="mic" type="checkbox" ${draft.mic?'checked':''}> 입장 시 마이크 켜기</label><label><input name="camera" type="checkbox" ${draft.camera?'checked':''}> 입장 시 카메라 켜기</label></div><p class="note">이 브라우저에 등록된 회원을 찾아 초대합니다. 이메일과 사용자 아이디가 같은 회원이면 한 번만 추가됩니다. 실제 이메일 발송은 하지 않습니다.</p><div class="modal-footer"><button type="button" data-action="close" class="ghost">취소</button><button class="primary">${draft.scheduled?'예약 및 초대 링크 생성':'회의 만들기'}</button></div></form>`)}
function futureDate(){const d=new Date(Date.now()+86400000);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(' ','T')}
function inviteChips(){return `<span class="chip">${esc(S.profile.name)} · 호스트</span>`+draft.invites.map((x,i)=>{const account=inviteAccount(x);return `<span class="chip">${esc(account?.name||inviteLabel(x))} <small>${esc(account?.email||'기존 초대')}</small><button type="button" data-action="remove-invite" data-id="${i}" aria-label="${esc(inviteLabel(x))} 초대 삭제">×</button></span>`}).join('')}
function captureDraft(){if(!$('#create-form'))return;const f=new FormData($('#create-form'));Object.assign(draft,{title:f.get('title'),access:f.get('access'),waiting:f.has('waiting'),mic:f.has('mic'),camera:f.has('camera'),date:f.get('date')||draft.date,duration:f.get('duration')||draft.duration})}
function join(){modal(`${modalHead('Join a meeting','회의 참여')}<p class="muted" style="font-size:12px">초대 링크를 입력한 뒤 장치를 확인하세요.</p><form id="join-form"><label>회의 링크<input name="link" required placeholder="https://shield.example/meeting/…" autocomplete="off"></label><div class="error" id="join-error" role="alert"></div><button type="button" class="link" style="margin-top:12px;font-size:11px" data-action="sample-link">예시 초대 링크 입력</button><div class="modal-footer"><button type="button" data-action="close">취소</button><button class="primary">장치 확인 후 참여</button></div></form>`)}
function preflight(meeting,role){if(S.closedMeetings.includes(meeting.id)){toast('종료된 회의의 초대 링크는 만료되었습니다.');return}S.meeting=meeting;S.role=role;S.mic=meeting.mic;S.camera=meeting.camera;modal(`${modalHead('Ready to join','회의에 참여할 준비가 되었나요?')}<div class="preview" id="preflight-preview"><div class="initial">${esc(S.profile.name[0])}</div></div><p><strong>${esc(meeting.title)}</strong><br><small>${role==='host'?'호스트로 시작합니다.':meeting.waiting?'입장 요청 후 승인 흐름을 체험합니다.':'참가자로 참여합니다.'}</small></p><div class="field-grid"><label><input type="checkbox" id="pre-mic" ${S.mic?'checked':''}> 마이크 켜기</label><label><input type="checkbox" id="pre-camera" ${S.camera?'checked':''}> 카메라 켜기</label></div><div class="row wrap" style="margin-top:20px"><button data-action="preview-device">카메라·마이크 미리보기</button><small id="media-note">아직 장치에 접근하지 않았습니다.</small></div><div class="modal-footer"><button data-action="close">취소</button><button class="primary" data-action="enter">${role==='guest'&&meeting.waiting?'입장 요청':'회의 시작'}</button></div>`,false,()=>{if(S.page!=='meeting')stopLocal()})}
async function enableMedia(){if(!navigator.mediaDevices?.getUserMedia){toast('장치 사용은 localhost 또는 HTTPS에서 지원됩니다.');return false}try{stopLocal();S.live=await navigator.mediaDevices.getUserMedia({audio:S.devices.audio?{deviceId:{exact:S.devices.audio}}:true,video:S.devices.video?{deviceId:{exact:S.devices.video}}:true});syncTracks();return true}catch(e){toast('장치에 연결하지 못했습니다. 브라우저 권한과 장치 연결을 확인하세요.');return false}}
function syncTracks(){S.live?.getAudioTracks().forEach(t=>t.enabled=S.mic);S.live?.getVideoTracks().forEach(t=>t.enabled=S.camera)}
function stopLocal(){S.live?.getTracks().forEach(t=>t.stop());S.live=null}
function attachVideo(){const v=$('#local-video');if(v&&S.live)v.srcObject=S.live;const sh=$('#share-video');if(sh&&S.share)sh.srcObject=S.share}
function enterMeeting(){S.mic=$('#pre-mic')?.checked??S.mic;S.camera=$('#pre-camera')?.checked??S.camera;S.page='meeting';closeModal();syncTracks();S.people=initialPeople();S.people[0].mic=S.mic;S.people[0].camera=S.camera;S.messages=[{name:'SHIELD',text:'회의에 오신 것을 환영합니다. 위험도는 데모 데이터이며 신원을 확정하지 않습니다.',time:time()}];S.tab='people';S.alert=true;S.waiting=S.role==='host'&&S.meeting.waiting?[{id:5,name:'정하린'}]:[];S.started=Date.now();S.window=1;renderMeeting();clearInterval(S.timer);S.timer=setInterval(()=>{if(S.page!=='meeting'||S.network!=='online')return;S.window++;const target=S.people.find(p=>p.id===2);if(target){const values=[72,74,71,76,73];target.score=values[S.window%5];target.audio=target.score-4;target.visual=target.score+4;S.history.push(target.score);S.history=S.history.slice(-8)}updateRiskDisplay()},5000)}
function time(){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function tone(n){return n<=33?'safe':n<=66?'medium':'high'}function riskLabel(n){return n<=33?'낮은 위험':n<=66?'주의':'높은 위험'}
function tile(p){return `<article class="tile ${p.score>=67?'high-border':''} ${p.speaking&&p.mic?'speaking':''} ${p.id===1?'background-'+S.bg:''}" data-person="${p.id}"><button class="risk ${tone(p.score)}" data-action="risk" data-id="${p.id}" aria-label="${esc(p.name)} 위험도 상세">● <span data-score="${p.id}">${p.score}</span>% ↗</button>${p.id===1&&S.live&&S.camera?'<video id="local-video" autoplay muted playsinline></video>':`<div class="initial">${esc(p.name[0])}</div>`}<div class="tile-bottom"><div><div class="tile-name">${esc(p.name)}${p.id===1?' <small>(나)</small>':''} ${p.host?'<small>♔ 호스트</small>':''}</div><div class="tile-meta">${p.mic?(p.speaking?'▥ 발화 중':'♩ 마이크 켜짐'):'⌁ 음소거'} · ${p.camera?'카메라 켜짐':'카메라 꺼짐'}${p.id!==1?' · 예시 참가자':''}</div></div><span class="pill ${tone(p.score)}">${riskLabel(p.score)}</span></div></article>`}
function renderMeeting(){const high=S.people.find(p=>p.score>=67);$('#app').innerHTML=`<header class="header meeting-header"><div class="row">${logo()}<div class="hide-mobile" style="padding-left:15px;border-left:1px solid var(--line)"><div style="font-size:12px">${esc(S.meeting.title)}</div><small>● ${S.network==='online'?'연결됨':'재연결 중'} · ${S.people.length}명 · ${S.role==='host'?'호스트':'참가자'}</small></div></div><div class="row"><span class="pill safe hide-tablet">⛨ 보호 UI 활성화</span><span class="demo-badge hide-mobile">AI · 참가자 시뮬레이션</span><button class="ghost hide-mobile" data-action="copy" style="font-size:11px">⧉ 초대 링크</button><button class="ghost" data-action="info" aria-label="회의 정보">ⓘ</button></div></header><main class="meeting-layout"><section class="stage">${S.network!=='online'?'<div class="connection" role="status">◌ 연결이 끊어졌습니다. 미디어 상태를 확인하고 다시 연결하는 중입니다…</div>':''}${S.alert&&high?`<div class="alert" role="alert"><span style="font-size:22px;color:var(--red)">⚠</span><div style="flex:1"><strong>${esc(high.name)}님의 높은 위험 신호가 감지되었습니다.</strong><p>별도 채널로 신원을 확인하세요. 위험도는 딥페이크 확정 판정이 아닙니다.</p></div><button data-action="risk" data-id="${high.id}" style="font-size:10px">상세</button><button class="close" data-action="dismiss-alert" aria-label="위험 알림 닫기">×</button></div>`:''}<div class="row between stage-title"><div><div class="eyebrow" style="font-size:9px">Secure workspace</div><h1>${S.share?'화면 공유 중':'참가자 화면'}</h1></div><div class="row"><small id="analysis-window">5초 Window · #${S.window}</small><span class="pill safe">● LIVE DEMO</span></div></div>${S.share?'<div class="share-stage"><video id="share-video" autoplay muted playsinline></video></div>':''}<div class="tiles">${S.people.map(tile).join('')}</div><div class="controls">${control('mic',S.mic?'♩':'⌁',S.mic?'마이크 끄기':'마이크 켜기','마이크',!S.mic)}${control('camera',S.camera?'▣':'▧',S.camera?'카메라 끄기':'카메라 켜기','카메라',!S.camera)}${control('share','↥',S.share?'화면 공유 중지':'화면 공유 시작','화면 공유',!!S.share)}${control('record','●',S.recording?'녹화 중지':'녹화 시작','녹화',S.recording,S.role!=='host')}${control('chat','▤','채팅 열기','채팅',S.tab==='chat')}${control('settings','⚙','회의 환경 설정','설정')}${control('leave','⌕','회의 나가기','나가기',true)}</div><div class="toolbar-note">${S.recording?'<span style="color:#ff9ba4">● 녹화 중 · 회의 화면·채팅과 사용 가능한 오디오를 녹화합니다.</span>':S.live?'내 장치 연결됨 · 원격 참가자는 예시 데이터입니다.':'장치 미연결 · 설정에서 실제 카메라와 마이크를 연결할 수 있습니다.'}</div></section><aside class="sidebar"><div class="tabs"><button data-action="tab-people" class="${S.tab==='people'?'active':''}">참가자 ${S.people.length}</button><button data-action="tab-chat" class="${S.tab==='chat'?'active':''}">채팅 ${S.messages.length}</button></div>${S.tab==='chat'?chatPanel():peoplePanel()}<section class="risk-summary"><div class="row between"><h3>Deepfake Risk</h3><span class="demo-badge">SIMULATED</span></div><small>영상·음성 신호를 Window 단위로 갱신</small><div class="meter"><span></span><span></span><span></span></div><div class="legend"><span>낮음 0–33%</span><span>주의 34–66%</span><span>높음 67–100%</span></div><p style="font-size:10px;color:var(--muted);margin-bottom:0">신원 확인을 돕는 참고 지표입니다.<br>AI 모델과 SFU는 연결되지 않았습니다.</p></section></aside></main>`;attachVideo()}
function control(action,icon,label,caption,active=false,disabled=false){return `<div class="control-item"><button data-action="${action}" aria-label="${label}" title="${label}" class="${active?'off':''}" ${disabled?'disabled':''}>${icon}</button><small>${caption}</small></div>`}
function peoplePanel(){return `${S.people.map(p=>`<div class="person"><span class="avatar">${esc(p.name[0])}</span><div class="grow"><div class="person-name">${esc(p.name)} ${p.id===1?'(나)':''} ${p.host?'♔':''}</div><small class="${tone(p.score)}"><span data-score="${p.id}">${p.score}</span>% · ${riskLabel(p.score)}</small><div><small>● 연결됨 · ${p.mic?'마이크 켜짐':'음소거'}</small></div></div><button data-action="risk" data-id="${p.id}" aria-label="${esc(p.name)} 분석 상세">↗</button>${S.role==='host'&&p.id!==1?`<button class="danger" data-action="remove" data-id="${p.id}">퇴장</button>`:''}</div>`).join('')}${S.waiting.length?`<div class="waiting"><h3>◷ 입장 대기 · ${S.waiting.length}명</h3>${S.waiting.map(p=>`<div style="font-size:12px">${esc(p.name)} <small>· 데모 요청</small></div><div class="row" style="margin-top:9px"><button class="primary" data-action="approve" data-id="${p.id}" style="font-size:11px">입장 승인</button><button class="ghost" data-action="reject" data-id="${p.id}" style="font-size:11px">거절</button></div>`).join('')}</div>`:''}<button class="ghost full" data-action="info" style="margin-top:16px;font-size:11px">회의 정보 및 초대 상태</button>`}
function chatPanel(){return `<div class="chatlog" aria-live="polite">${S.messages.map(m=>`<div><div class="row between"><small>${esc(m.name)}</small><small>${m.time}</small></div><div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">메시지</label><input id="chat-input" name="message" placeholder="메시지를 입력하세요" maxlength="1000" required autocomplete="off"><button class="primary" aria-label="메시지 전송">↑</button></form><small style="margin-top:8px">이 탭의 로컬 채팅 체험입니다.</small><button class="ghost" data-action="sample-message" style="font-size:10px;margin-top:10px">참가자 수신 메시지 체험</button>`}
function updateRiskDisplay(){if($('#analysis-window'))$('#analysis-window').textContent=`5초 Window · #${S.window}`;S.people.forEach(p=>document.querySelectorAll(`[data-score="${p.id}"]`).forEach(e=>e.textContent=p.score))}
function risk(id){const p=S.people.find(p=>p.id===Number(id));if(!p)return;modal(`${modalHead('Trust signals','참가자 위험도 분석')}<div class="row" style="margin-top:17px"><span class="avatar">${esc(p.name[0])}</span><div><strong>${esc(p.name)}</strong><br><small>최근 분석 Window #${S.window} · 예시 데이터</small></div><span class="pill ${tone(p.score)}" style="margin-left:auto">${riskLabel(p.score)}</span></div><div class="detail-grid"><div class="detail-stat"><small>통합 Deepfake Risk</small><strong class="${tone(p.score)}">${p.score}%</strong></div><div class="detail-stat"><small>영상 신호</small><strong>${p.visual}%</strong></div><div class="detail-stat"><small>음성 신호</small><strong>${p.audio}%</strong></div></div><h3>최근 위험도 흐름 <small> / 5초 간격</small></h3><div class="spark">${(p.id===2?S.history:[12,18,16,23,20,p.score,p.score,p.score]).map(v=>`<i style="height:${v}%" title="${v}%"></i>`).join('')}</div><div class="row between"><small>이전 Window</small><small>최근 Window</small></div><div class="panel" style="margin-top:18px;padding:14px"><strong style="font-size:12px">${p.score>=67?'별도 채널로 신원을 재확인하세요.':'대화를 이어가며 신뢰 신호를 확인하세요.'}</strong><p style="font-size:11px;color:var(--muted);margin-bottom:0">${p.score>=67?'등록된 연락처로 직접 확인하고, 민감한 정보 제공이나 송금 전에 확인 절차를 거치세요.':'위험도는 신원 확인을 돕는 참고 지표이며 정상 여부를 보증하지 않습니다.'}</p></div><p class="note">데모 점수입니다. 실제 Audio-Visual 모델 추론 결과가 아닙니다. 카메라가 꺼진 예시 참가자 점수는 마지막 관측값을 표시합니다.</p><div class="modal-footer"><button data-action="close">확인</button></div>`)}
function info(m=S.meeting){modal(`${modalHead('Meeting information','회의 정보 및 초대')}<h3>${esc(m.title)}</h3><div class="field-grid"><div class="panel"><small>일정</small><div>${m.date?esc(m.date.replace('T',' · ')):'즉시 회의'}</div><small>Asia/Seoul ${m.duration?'· '+esc(m.duration):''}</small></div><div class="panel"><small>참여 설정</small><div>${esc(m.access)}</div><small>대기실 ${m.waiting?'사용':'미사용'} · 마이크 ${m.mic?'켜짐':'꺼짐'} · 카메라 ${m.camera?'켜짐':'꺼짐'}</small></div></div><label>초대 링크<input readonly id="invite-link" value="${esc(linkFor(m))}"></label><button data-action="copy" data-id="${m.id}" class="full" style="margin-top:10px">초대 링크 복사</button><h3 style="margin-top:20px">초대 상태 <small> / 데모</small></h3>${m.invites.length?m.invites.map(x=>`<div class="row between person"><span style="font-size:12px">${esc(inviteLabel(x))}</span><span class="pill medium">${S.closedMeetings.includes(m.id)?'회의 종료':x.status==='accepted'?'참여 확인':'앱 초대 등록'}</span></div>`).join(''):'<small>이메일·사용자 아이디로 추가한 초대자가 없습니다.</small>'}<p class="note">데모 링크입니다. 이 브라우저의 데모에서 참여 흐름을 확인할 수 있습니다. 초대받은 계정의 홈에서 초대를 확인할 수 있습니다. 다른 기기 연결과 실제 이메일 발송은 지원하지 않습니다.</p><div class="modal-footer">${S.page!=='meeting'?`<button class="primary" data-action="start-scheduled" data-id="${m.id}">호스트로 시작</button>`:'<button data-action="close">확인</button>'}</div>`)}
function linkFor(m){return `https://shield.example/meeting/${m.id}`}
async function copyLink(id){const m=S.schedules.find(m=>m.id===id)||S.meeting;if(!m)return;try{await navigator.clipboard.writeText(linkFor(m));toast('초대 링크를 복사했습니다.')}catch{const input=$('#invite-link');if(input){input.focus();input.select();toast('링크를 선택했습니다. Ctrl+C로 복사하세요.')}else{info(m);toast('링크를 선택해 복사하세요.')}}}
async function settings(){modal(`${modalHead('Meeting preferences','장치 및 배경 설정')}<div class="tabs"><button class="active">미디어 환경</button></div><form id="settings-form"><label>마이크<select name="audio" id="audio-devices"><option value="">시스템 기본 마이크</option></select></label><label>카메라<select name="video" id="video-devices"><option value="">시스템 기본 카메라</option></select></label><button type="button" data-action="connect-device" style="margin-top:15px">장치 권한 요청 및 연결</button><p class="note">권한을 허용하면 사용 가능한 장치 이름이 표시됩니다. 변경한 장치 선택은 저장 시 적용됩니다.</p><label>배경 효과 미리보기<select name="background"><option value="none" ${S.bg==='none'?'selected':''}>원본</option><option value="blur" ${S.bg==='blur'?'selected':''}>흐림 미리보기</option></select></label><small>배경은 로컬 UI 효과입니다. 인물 분리·송출 효과는 미연동이며, 흐림은 영상 전체에 적용됩니다.</small><div class="option"><div>연결 복구 시나리오<br><small>재연결 상태와 복귀 흐름 확인</small></div><button type="button" data-action="network-demo" style="font-size:10px">연결 끊김 체험</button></div><div class="modal-footer"><button type="button" data-action="close">취소</button><button class="primary">설정 저장</button></div></form>`);await populateDevices()}
async function populateDevices(){try{const list=await navigator.mediaDevices?.enumerateDevices();for(const [kind,id,key] of [['audioinput','audio-devices','audio'],['videoinput','video-devices','video']]){const e=$('#'+id);if(!e)continue;e.innerHTML='<option value="">시스템 기본 장치</option>'+(list||[]).filter(d=>d.kind===kind).map((d,i)=>`<option value="${esc(d.deviceId)}" ${S.devices[key]===d.deviceId?'selected':''}>${esc(d.label||'장치 '+(i+1))}</option>`).join('')}}catch{toast('장치 목록을 읽을 수 없습니다.')}}
async function share(){if(S.share){S.share.getTracks().forEach(t=>t.stop());S.share=null;renderMeeting();return}try{S.share=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});S.share.getVideoTracks()[0].addEventListener('ended',()=>{S.share=null;if(S.page==='meeting')renderMeeting()});renderMeeting()}catch{toast('화면 공유를 시작하지 않았습니다. 브라우저에서 공유 대상을 선택하세요.')}}
function recordingDialog(){if(S.role!=='host')return;if(S.recording){S.recorder.stop();return}modal(`${modalHead('Meeting recording','회의 녹화 시작')}<div class="panel"><small>녹화 시작 후 참가자 안내</small><p><strong>해당 회의는 녹화 중입니다.</strong></p></div><p class="muted" style="font-size:12px">녹화가 시작되면 위 문구를 회의 화면에 표시합니다. 회의 화면 옆에 채팅창을 항상 함께 녹화합니다.</p><div class="panel"><strong style="font-size:12px">녹화할 SHIELD 회의 탭을 선택하세요.</strong><p class="muted" style="font-size:11px">선택한 화면에 위험도와 채팅창을 합성합니다. 저장 성공 시 개인 보관함에서 재생·다운로드·삭제할 수 있습니다. 참가자별 동의 확인란은 사용하지 않습니다.</p></div><div class="modal-footer"><button data-action="close">취소</button><button class="primary" data-action="record-confirm">대상 선택 및 녹화 시작</button></div>`)}
async function startRecording(){}
function records(){modal(`${modalHead('Recordings','녹화 보관함')}<p class="note">이 탭에서 생성한 녹화 파일입니다. 새로고침·탭 종료 시 사라지므로 다운로드하세요.</p>${S.records.length?S.records.map(r=>`<div class="record-row"><span style="font-size:24px">▣</span><div class="grow"><strong style="font-size:12px">${esc(r.title)}</strong><br><small>${r.date} · ${r.seconds}초 · ${(r.size/1024/1024).toFixed(1)} MB · WebM</small></div><button data-action="play-record" data-id="${r.id}" style="font-size:10px">보기</button><a href="${r.url}" download="SHIELD-${r.id}.webm">다운로드</a><button class="danger" data-action="delete-record" data-id="${r.id}">삭제</button></div>`).join(''):'<div class="empty">아직 녹화 파일이 없습니다.<br>호스트로 회의에 입장해 녹화를 시작하세요.</div>'}<div class="modal-footer"><button data-action="close">닫기</button></div>`,true)}
function leaveDialog(){modal(`${modalHead('Leave meeting',S.role==='host'?'회의를 전체 종료할까요?':'회의에서 나가시겠어요?')}<p class="muted" style="font-size:12px">${S.role==='host'?'MVP에서는 호스트 이양을 제공하지 않습니다. 호스트가 나가면 전체 회의가 종료되고 초대 링크가 만료됩니다.':'내 참여만 종료하며 회의가 끝나기 전에는 다시 입장을 요청할 수 있습니다.'}${S.recording?' 진행 중인 녹화는 정지 후 개인 보관함에 저장됩니다.':''}</p><div class="modal-footer"><button data-action="close">계속 참여</button>${S.role==='host'?'<button class="primary" data-action="end-all">모두에게 회의 종료</button>':'<button class="primary" data-action="leave-confirm">나가기</button>'}</div>`)}
function leave(all=false){const finish=()=>{clearInterval(S.timer);S.page='dashboard';stopLocal();S.share?.getTracks().forEach(t=>t.stop());S.share=null;S.network='online';closeModal();dashboard();toast(all?'전체 회의 종료 흐름을 완료했습니다. (로컬 데모)':'회의에서 나왔습니다.');if(S.records.length)records()};if(S.recording){S.afterRecord=finish;S.recorder.stop()}else finish()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close')closeModal();else if(a==='signup')login(true);else if(a==='login')login();else if(a==='demo-login'){switchProfile(S.accounts.find(x=>x.id==='demo-account'));dashboard()}else if(a==='profile')profile();else if(a==='logout'){closeModal();login()}else if(a==='create')create();else if(a==='schedule')create(true);else if(a==='create-now'||a==='create-later'){captureDraft();draft.scheduled=a==='create-later';createView()}else if(a==='add-invite'){addInvite()}else if(a==='remove-invite'){draft.invites.splice(Number(id),1);$('#invites').innerHTML=inviteChips()}else if(a==='join')join();else if(a==='sample-link')$('#join-form input').value='https://shield.example/meeting/secure-review';else if(a==='schedule-info')info(S.schedules.find(m=>m.id===id));else if(a==='start-scheduled')preflight(S.schedules.find(m=>m.id===id),'host');else if(a==='preview-device'){S.mic=$('#pre-mic').checked;S.camera=$('#pre-camera').checked;if(await enableMedia()){const target=$('#preflight-preview');if(target){target.innerHTML='<video autoplay muted playsinline id="pre-video"></video>';$('#pre-video').srcObject=S.live;$('#media-note').textContent='장치 연결됨 · 로컬 미리보기'}}}else if(a==='enter'){if(S.role==='guest'&&S.meeting.waiting){showWaiting()}else enterMeeting()}else if(a==='simulate-approval')approveWaiting();else if(a==='mic'){S.mic=!S.mic;syncTracks();S.people[0].mic=S.mic;renderMeeting()}else if(a==='camera'){S.camera=!S.camera;syncTracks();S.people[0].camera=S.camera;renderMeeting()}else if(a==='tab-people'){S.tab='people';renderMeeting()}else if(a==='tab-chat'||a==='chat'){S.tab=S.tab==='chat'&&a==='chat'?'people':'chat';renderMeeting()}else if(a==='risk')risk(id);else if(a==='dismiss-alert'){S.alert=false;renderMeeting()}else if(a==='info')info();else if(a==='copy')await copyLink(id);else if(a==='settings')await settings();else if(a==='connect-device'){if(await enableMedia()){await populateDevices();toast('장치가 연결되었습니다.')}attachVideo()}else if(a==='share')await share();else if(a==='record')recordingDialog();else if(a==='record-confirm')await startRecording();else if(a==='records')records();else if(a==='play-record'){const r=S.records.find(x=>x.id===id);modal(`${modalHead('Recording preview',esc(r.title))}<video controls src="${r.url}" style="width:100%;margin-top:16px"></video><div class="modal-footer"><button data-action="records">보관함으로</button></div>`,true)}else if(a==='approve'){const p=S.waiting.find(p=>p.id===Number(id));if(p){S.people.push({...p,score:23,audio:20,visual:26,mic:false,camera:false});S.waiting=S.waiting.filter(x=>x!==p);renderMeeting();toast(`${p.name}님의 입장을 승인했습니다.`)}}else if(a==='reject'){S.waiting=S.waiting.filter(p=>p.id!==Number(id));renderMeeting();toast('입장 요청을 거절했습니다.')}else if(a==='remove'){const p=S.people.find(p=>p.id===Number(id));modal(`${modalHead('Host controls','참가자를 퇴장시키시겠어요?')}<p>${esc(p.name)}님의 회의 참여가 종료됩니다.</p><div class="modal-footer"><button data-action="close">취소</button><button class="primary" data-action="confirm-remove" data-id="${id}">퇴장 처리</button></div>`)}else if(a==='confirm-remove'&&S.role==='host'){S.removedPeople.push({...S.people.find(p=>p.id===Number(id))});S.people=S.people.filter(p=>p.id!==Number(id));closeModal();renderMeeting();toast('참가자를 퇴장 처리했습니다.')}else if(a==='sample-message'){S.messages.push({name:'이지현',text:'네, 별도 연락처로 신원 확인 후 진행하겠습니다. (수신 예시)',time:time()});renderMeeting()}else if(a==='network-demo'){closeModal();S.network='reconnecting';renderMeeting();setTimeout(()=>{if(S.page!=='meeting')return;S.network='online';renderMeeting();toast('연결 복구 흐름이 완료되었습니다. (시뮬레이션)')},4000)}else if(a==='leave')leaveDialog();else if(a==='leave-confirm')leave();else if(a==='end-all'&&S.role==='host')leave(true)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='auth-form'){handleAccountForm(f,d)}else if(f.id==='profile-form'){handleProfileForm(d)}else if(f.id==='create-form'){captureDraft();const title=draft.title.trim();if(!title){toast('회의 이름을 입력하세요.');return}const m={...draft,title,id:crypto.randomUUID?.()||String(Date.now()),ownerId:currentOwner(),date:draft.scheduled?d.get('date'):null,duration:d.get('duration')};if(m.date&&new Date(m.date+'+09:00')<=new Date()){toast('예약 시간을 현재보다 이후로 설정하세요.');return}if(m.scheduled){S.schedules.push(m);save('schedules',S.schedules);publishMeeting(m);closeModal();dashboard();info(m);toast('예약 회의와 초대 링크를 만들었습니다.')}else preflight(m,'host')}else if(f.id==='join-form'){const link=d.get('link').trim();let id;try{const url=new URL(link);if(url.protocol!=='https:'||url.hostname!=='shield.example'||!/^\/meeting\/[a-zA-Z0-9-]+\/?$/.test(url.pathname))throw Error();id=url.pathname.split('/')[2]}catch{$('#join-error').textContent='https://shield.example/meeting/… 형식의 초대 링크를 입력하세요.';return}if(S.closedMeetings.includes(id)){$('#join-error').textContent='종료된 회의입니다. 초대 링크가 만료되었습니다.';return}const m=meetingById(id);if(!m){$('#join-error').textContent='이 브라우저에서 확인할 수 없는 회의입니다. 초대받은 링크 또는 예시 링크를 사용하세요.';return}preflight(m,m.ownerId===currentOwner()?'host':'guest')}else if(f.id==='chat-form'){const text=d.get('message').trim();if(!text)return;S.messages.push({name:S.profile.name,text,time:time()});renderMeeting();$('#chat-input').focus();$('.chatlog').scrollTop=$('.chatlog').scrollHeight}else if(f.id==='settings-form'){S.bg=d.get('background');const changed=S.devices.audio!==d.get('audio')||S.devices.video!==d.get('video');S.devices={audio:d.get('audio'),video:d.get('video')};if(changed&&S.live)await enableMedia();closeModal();renderMeeting();toast('회의 환경을 적용했습니다.')}});
window.addEventListener('offline',()=>{if(S.page==='meeting'){S.network='reconnecting';renderMeeting()}});window.addEventListener('online',()=>{if(S.page==='meeting'){S.network='online';renderMeeting();toast('브라우저 네트워크가 복구되었습니다.')}});window.addEventListener('beforeunload',e=>{if(S.records.length||S.recording){e.preventDefault();e.returnValue=''}});

S.reports=load('reports-v2',[]);S.security=null;S.logFilter='all';S.activeReport=null;
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2);
const stamp=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t));
const elapsed=ms=>`${Math.floor(Math.max(0,ms)/60000).toString().padStart(2,'0')}:${Math.floor(Math.max(0,ms)/1000%60).toString().padStart(2,'0')}`;
const labelRisk=n=>n==null?'분석 대기':riskLabel(n);
const blobDB=()=>new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('unsupported'));const request=indexedDB.open('shield-media-v2',1);request.onupgradeneeded=()=>request.result.createObjectStore('recordings',{keyPath:'id'});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function dbRecord(action,value){const db=await blobDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('recordings',action==='read'?'readonly':'readwrite'),store=tx.objectStore('recordings');const req=action==='read'?store.getAll():action==='delete'?store.delete(value):store.put(value);let result;req.onsuccess=()=>result=req.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
S.mediaReady=(async()=>{try{const rows=await dbRecord('read');S.records=[...S.records,...rows.filter(r=>!S.records.some(x=>x.id===r.id)).map(r=>({...r,url:URL.createObjectURL(r.blob),blob:undefined,persisted:true}))];return true}catch{return false}})();
function persistReports(){try{localStorage.setItem('shield-reports-v2',JSON.stringify(S.reports));return true}catch{toast('기록을 저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.');return false}}
function beginSecurity(){S.history=[21,24,29,43,48,55,64,72];S.security={id:uid(),meetingId:S.meeting.id,title:S.meeting.title,startedAt:Date.now(),endedAt:null,people:{},samples:[],events:[],recordIds:[],example:false,model:'영상·음성 개별 분석 결과 기반 (데모)'};S.logFilter='all';sampleSecurity('입장');}
function sampleSecurity(reason='분석'){const r=S.security;if(!r||r.endedAt)return;const now=Date.now();for(const p of S.people){let old=r.people[p.id];if(!old){old=r.people[p.id]={id:p.id,name:p.name,last:null,peak:0,highCount:0,status:'참여 중',lastLevel:null,joinedAt:now};r.events.push({at:now,personId:p.id,name:p.name,type:'join',text:'회의 입장'})}const audio=p.mic?p.audio:null,visual=p.camera?p.visual:null,valid=audio!==null&&visual!==null;const score=valid?p.score:null;const level=valid?tone(score):'unavailable';const row={at:now,offset:now-r.startedAt,window:S.window,personId:p.id,name:p.name,score,audio,visual,level,reason};r.samples.push(row);old.status='참여 중';old.current=row;old.last=score??old.last;old.peak=Math.max(old.peak,score??0);if(level==='high'&&old.lastLevel!=='high'){old.highCount++;r.events.push({at:now,personId:p.id,name:p.name,type:'high',text:`고위험 감지 · ${score}%`});S.alert=true}if(old.lastLevel==='high'&&level!=='high')r.events.push({at:now,personId:p.id,name:p.name,type:valid?'recovery':'signal',text:valid?`고위험 구간 이탈 · ${score}%`:'신호 부족 · 분석 제한'});old.lastLevel=level;}
// Mark departed participants without discarding their detection history.
for(const p of Object.values(r.people)){if(p.status==='참여 중'&&!S.people.some(x=>x.id===p.id)){p.status='퇴장';p.leftAt=now;r.events.push({at:now,personId:p.id,name:p.name,type:'leave',text:'회의 퇴장'})}}
}
function finishSecurity(all){if(!S.security||S.security.endedAt)return null;sampleSecurity('종료 직전');const r=S.security;r.endedAt=Date.now();r.ownerId=currentOwner();r.endReason=all?'호스트 전체 종료':'나가기';S.reports.unshift(r);S.activeReport=r.id;r.persisted=true;if(!persistReports())r.persisted=false;return r}
const originalEnter=enterMeeting;enterMeeting=function(){originalEnter();beginSecurity();renderMeeting()};
const originalUpdate=updateRiskDisplay;updateRiskDisplay=function(){originalUpdate();sampleSecurity();if(S.page==='meeting')renderMeeting()};
const originalDashboard=dashboard;dashboard=function(){originalDashboard();const main=$('.container');main?.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>지난 회의 · 보안 결과 <small> / ${myReports().length}</small></h2><button class="ghost" data-action="archive">기록 전체 보기 →</button></div>${myReports().length?myReports().slice(0,3).map(reportCard).join(''):'<div class="panel empty">본인이 나가거나 회의가 종료되면 참여 구간의 보안 결과가 여기에 저장됩니다.<br><button class="link" data-action="sample-report" style="margin-top:12px">예시 보안 보고서 살펴보기</button></div>'}<p class="note">탐지 이력은 이 브라우저에 저장됩니다. AI 분석은 예시 데이터이며 신원을 확정하지 않습니다. 녹화는 브라우저 저장 성공 여부를 별도로 표시합니다.</p>`)};
function reportCard(r){const highs=r.events.filter(e=>e.type==='high').length;return `<div class="panel archive-card"><div><small>${stamp(r.startedAt)} · ${elapsed(r.endedAt-r.startedAt)} · ${r.example?'예시 기록':'데모 회의 기록'}</small><h3>${esc(r.title)}</h3><div class="row wrap"><span class="pill ${highs?'high':'safe'}">고위험 진입 ${highs}회</span><small>참가자 ${Object.keys(r.people).length}명 · 분석 ${r.samples.length}건 · 녹화 ${r.recordIds.length}개</small></div></div><div class="row wrap"><button data-action="report" data-id="${r.id}">보안 결과 보기 ↗</button><button class="danger" data-action="delete-report" data-id="${r.id}">내 기록 삭제</button></div></div>`}
function securityPanel(){const r=S.security;return `<div class="row between"><strong style="font-size:13px">실시간 탐지 이력</strong><span class="demo-badge">DEMO</span></div><p class="muted" style="font-size:11px">Video / Audio 개별 분석 · 5초 Window</p><div class="row wrap"><button class="ghost" data-action="risk-log" style="font-size:11px">전체 이력 ${r?.samples.length||0}건 ↗</button><button class="ghost" data-action="scenario" style="font-size:11px">탐지 시나리오 체험</button></div><div class="live-events">${(r?.events||[]).filter(e=>e.type!=='join').slice(-6).reverse().map(e=>`<div class="event-item"><small>${elapsed(e.at-r.startedAt)}</small><div><strong>${esc(e.name)}</strong><span class="${e.type==='high'?'high':''}">${esc(e.text)}</span></div></div>`).join('')||'<div class="empty">아직 탐지 이벤트가 없습니다.</div>'}</div><p class="note">신호가 부족하면 분석 제한으로 기록합니다. 최종 위험도는 마지막으로 유효한 관측값입니다.</p>`}
const originalMeeting=renderMeeting;renderMeeting=function(){const tab=S.tab;originalMeeting();const tabs=$('.sidebar .tabs');tabs?.insertAdjacentHTML('beforeend',`<button data-action="tab-security" class="${tab==='security'?'active':''}">보안 이력</button>`);if(tab==='security'){const side=$('.sidebar');side.innerHTML=`${tabs.outerHTML}${securityPanel()}`;}const controls=$('.toolbar-note');controls?.insertAdjacentHTML('afterend','<div class="row wrap" style="justify-content:center;margin-top:12px"><button class="ghost" data-action="scenario" style="font-size:10px">탐지 시나리오 체험</button><button class="ghost" data-action="risk-log" style="font-size:10px">분석 이력 확인</button></div>');document.querySelectorAll('.tile').forEach(el=>{const p=S.people.find(p=>p.id===Number(el.dataset.person));if(p&&(!p.mic||!p.camera)){const badge=el.querySelector('.pill');if(badge){badge.className='pill unavailable';badge.textContent='분석 제한'}const riskButton=el.querySelector('.risk');riskButton.className='risk unavailable';riskButton.innerHTML='◌ 신호 부족 ↗'}});};
const originalRisk=risk;risk=function(id){originalRisk(id);const p=S.people.find(p=>p.id===Number(id));if(!p)return;const footer=$('.modal-footer');footer?.insertAdjacentHTML('beforebegin',`<div class="signal-pair"><span class="${p.camera?tone(p.visual):'unavailable'}">Video · ${p.camera?p.visual+'%':'입력 없음'}</span><span class="${p.mic?tone(p.audio):'unavailable'}">Audio · ${p.mic?p.audio+'%':'입력 없음'}</span></div><p class="note">화면에 표시되는 점수는 예시 데이터입니다.${!p.mic||!p.camera?'<br>현재 신호 부족으로 통합 위험도를 새로 산출하지 않습니다. 상단 값은 예시 마지막 관측값입니다.':''}</p>`)};
function scenario(){modal(`${modalHead('Detection scenarios','탐지 흐름 체험')}<p class="muted" style="font-size:12px">박서윤님의 예시 신호를 바꾸고 경고·이력·종료 요약까지 확인하세요.</p><div class="scenario-grid"><button data-action="scenario-high">⚠ 고위험 감지<small>Video 88% · Audio 80%</small></button><button data-action="scenario-medium">◐ 주의 구간<small>Video 52% · Audio 44%</small></button><button data-action="scenario-low">✓ 낮은 위험<small>Video 22% · Audio 14%</small></button><button data-action="scenario-missing">◌ 신호 부족<small>분석 제한 상태 기록</small></button></div><p class="note">시나리오를 선택하면 자동 점수 변동을 멈추고 선택한 상태를 유지합니다. 분석 이력은 계속 기록됩니다.</p><div class="modal-footer"><button data-action="scenario-auto">자동 시나리오 재개</button><button data-action="close">닫기</button></div>`)}
function reportPeople(r){return `<div class="table-scroll"><table class="risk-table"><thead><tr><th>참가자</th><th>최종 유효 위험도</th><th>최고 위험도</th><th>고위험 진입</th><th>최종 상태</th></tr></thead><tbody>${Object.values(r.people).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="pill ${p.last==null?'unavailable':tone(p.last)}">${p.last==null?'관측 없음':p.last+'% · '+labelRisk(p.last)}</span></td><td>${p.last==null?'—':p.peak+'%'}</td><td>${p.highCount}회</td><td>${p.status==='퇴장'?'중도 퇴장':p.current?.score==null?'신호 부족':'참여 완료'}</td></tr>`).join('')}</tbody></table></div>`}
function eventTimeline(r){const events=r.events.filter(e=>['high','recovery','signal'].includes(e.type));return `<div class="timeline">${events.length?events.map(e=>`<div class="event-item"><small>${elapsed(e.at-r.startedAt)}</small><div><strong>${esc(e.name)}</strong><span class="${e.type==='high'?'high':''}">${esc(e.text)}</span></div></div>`).join(''):'<div class="empty">고위험 감지 이력이 없습니다.</div>'}</div>`}
function showReport(id){const r=myReports().find(x=>x.id===id);if(!r)return;S.activeReport=id;modal(`${modalHead('Meeting security report','참여 종료 · 보안 결과')}<div class="row between wrap" style="margin-top:16px"><div><h3 style="font-size:17px;margin:0">${esc(r.title)}</h3><small>${stamp(r.startedAt)} · ${elapsed(r.endedAt-r.startedAt)} · ${r.example?'예시 보고서':'데모 분석 결과'}</small></div><span class="pill ${r.events.some(e=>e.type==='high')?'high':'safe'}">${r.events.some(e=>e.type==='high')?'신원 재확인 권장':'고위험 기록 없음'}</span></div><div class="report-stats"><div><small>분석 기록</small><strong>${r.samples.length}<em>건</em></strong></div><div><small>고위험 진입</small><strong>${r.events.filter(e=>e.type==='high').length}<em>회</em></strong></div><div><small>참가자</small><strong>${Object.keys(r.people).length}<em>명</em></strong></div><div><small>연결된 녹화</small><strong>${r.recordIds.length}<em>개</em></strong></div></div><h3>참가자별 최종 결과</h3>${reportPeople(r)}<p class="muted" style="font-size:10px">본인 입장부터 퇴장 또는 회의 종료까지 관측한 결과입니다. 입장 전·퇴장 후는 포함하지 않습니다.<br>최종 위험도 = 마지막 유효 관측값 · 최고 위험도 = 유효 관측 중 최대값 · 고위험 진입 = High 구간에 들어간 횟수</p><h3 style="margin-top:24px">주요 고위험 감지 시점</h3>${eventTimeline(r)}<div class="panel" style="margin-top:18px"><div class="row between wrap"><div><strong style="font-size:12px">회의 영상과 Risk 표시 함께 확인</strong><br><small>${r.recordIds.length?'녹화 파일을 열어 탐지 시점과 대조하세요.':'이 회의는 녹화하지 않았습니다. 탐지 이력은 별도로 보관됩니다.'}</small></div><button data-action="report-records" data-id="${r.id}" ${!r.recordIds.length?'disabled':''}>녹화 보기</button></div></div><p class="note">AI 모델 미연동 · 모든 점수는 데모 데이터입니다. 회의 내용의 텍스트 요약을 생성한 것이 아니라 보안 탐지 결과를 요약했습니다. ${r.example?'이 보고서는 기능 설명용 예시입니다.':r.persisted===false?'저장 실패 · 현재 탭에만 보관됩니다. 브라우저 저장 공간을 확인하세요.':'이 브라우저의 저장 공간에서 다시 확인할 수 있습니다.'}</p><div class="modal-footer wrap"><button data-action="risk-log" data-id="${r.id}">상세 이력</button><button class="primary" data-action="close">확인</button></div>`,true)}
function archive(){modal(`${modalHead('Meeting archive','지난 회의 및 탐지 결과')}<p class="note">본인의 참여 구간별 보안 결과를 이 브라우저에 보관합니다. 퇴장 시 결과가 확정되며 재입장은 별도 기록입니다. 보안 결과는 열람·삭제만 가능하고 다른 기기와 동기화되지 않습니다.</p>${myReports().length?myReports().map(reportCard).join(''):'<div class="empty">종료된 회의가 없습니다.</div>'}<div class="modal-footer"><button data-action="sample-report">예시 보고서 보기</button><button data-action="close">닫기</button></div>`,true)}
function logView(id){const r=id?myReports().find(r=>r.id===id):S.security;if(!r)return;modal(`${modalHead('Detection history','참가자별 탐지 이력')}<p class="muted" style="font-size:12px">${esc(r.title)} · ${r.samples.length}건</p>${logRows(r)}<div class="modal-footer"><button data-action="close">닫기</button></div>`,true)}
function logRows(r){const rows=r.samples.slice(-200).reverse();return `<div class="table-scroll log-scroll"><table class="risk-table"><thead><tr><th>경과</th><th>참가자</th><th>Video</th><th>Audio</th><th>Risk</th><th>상태</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${elapsed(row.offset)}</td><td>${esc(row.name)}</td><td>${row.visual==null?'—':row.visual+'%'}</td><td>${row.audio==null?'—':row.audio+'%'}</td><td>${row.score==null?'—':row.score+'%'}</td><td>${row.score==null?'분석 제한':riskLabel(row.score)}</td></tr>`).join('')||'<tr><td colspan="6">기록이 없습니다.</td></tr>'}</tbody></table></div><small>최근 최대 200건 표시</small>`}
function exampleReport(){const exists=myReports().find(r=>r.example);if(exists){showReport(exists.id);return}const started=Date.now()-720000;const r={id:uid(),title:'예시 · 제품 보안 검토 회의',startedAt:started,endedAt:started+600000,people:{},samples:[],events:[],recordIds:[],example:true,ownerId:currentOwner(),model:'영상·음성 개별 분석 (예시)'};[{id:1,name:'김민준',values:[18,21,17,19,18]},{id:2,name:'박서윤',values:[25,48,84,72,28]},{id:3,name:'이지현',values:[33,46,51,40,36]},{id:4,name:'최다니엘',values:[12,18,15,14,12]}].forEach(p=>{let previous='safe',highCount=0;for(let i=0;i<p.values.length;i++){const score=p.values[i],at=started+i*120000,level=tone(score);r.samples.push({at,offset:at-started,window:i+1,personId:p.id,name:p.name,score,audio:Math.max(0,score-4),visual:Math.min(100,score+4),level,reason:'예시'});if(level==='high'&&previous!=='high'){highCount++;r.events.push({at,personId:p.id,name:p.name,type:'high',text:`고위험 감지 · ${score}%`})}if(previous==='high'&&level!=='high')r.events.push({at,personId:p.id,name:p.name,type:'recovery',text:`고위험 구간 이탈 · ${score}%`});previous=level}r.people[p.id]={id:p.id,name:p.name,last:p.values.at(-1),peak:Math.max(...p.values),highCount,status:'참여 중',current:{score:p.values.at(-1)}}});r.samples.sort((a,b)=>a.at-b.at);S.reports.unshift(r);persistReports();showReport(r.id)}
startRecording=async function(){if(S.role!=='host'||S.recording)return;let display=null,ctx=null,frame=0,output=null,audio=[];const video=document.createElement('video');let stopDraw=false;try{if(!window.MediaRecorder||!navigator.mediaDevices?.getDisplayMedia)throw Error('unsupported');display=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});video.srcObject=display;video.muted=true;video.playsInline=true;await video.play();const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=900;const g=canvas.getContext('2d');if(!g||!canvas.captureStream)throw Error('canvas unsupported');const recordingId=uid(),meetingId=S.security.id,started=Date.now(),title=S.meeting.title;
function draw(){if(stopDraw)return;g.fillStyle='#111214';g.fillRect(0,0,1600,900);g.font='bold 22px sans-serif';g.fillStyle='#f5f5f6';g.fillText('SHIELD / '+title.slice(0,40),24,35);g.font='14px sans-serif';g.fillStyle='#ff9ba4';g.fillText('해당 회의는 녹화 중입니다. · '+elapsed(Date.now()-started),1030,35);const scale=Math.min(1200/(video.videoWidth||1200),650/(video.videoHeight||650));const vw=(video.videoWidth||1200)*scale,vh=(video.videoHeight||650)*scale;if(video.readyState>=2)g.drawImage(video,(1200-vw)/2,60+(650-vh)/2,vw,vh);g.fillStyle='#191a1d';g.fillRect(0,722,1200,178);g.font='14px sans-serif';g.fillStyle='#aaaab4';g.fillText('Deepfake Risk · 예시 데이터 · '+stamp(Date.now()),24,750);const people=S.people.slice(0,6),pw=1152/Math.max(1,people.length);people.forEach((p,i)=>{const x=24+i*pw,valid=p.mic&&p.camera;g.fillStyle='#f5f5f6';g.font='17px sans-serif';g.fillText(p.name.slice(0,12),x,783);g.fillStyle=!valid?'#96969f':p.score>=67?'#ff8e98':p.score>=34?'#edc46b':'#6dd8ac';g.font='bold 23px sans-serif';g.fillText(valid?p.score+'% · '+riskLabel(p.score):'신호 부족',x,818);g.fillStyle='#aaaab4';g.font='12px sans-serif';g.fillText('Video '+(p.camera?p.visual+'%':'—')+' / Audio '+(p.mic?p.audio+'%':'—'),x,845)});g.fillStyle='#151619';g.fillRect(1220,60,380,840);g.fillStyle='#f5f5f6';g.font='bold 21px sans-serif';g.fillText('회의 채팅',1240,95);g.font='12px sans-serif';g.fillStyle='#96969f';g.fillText('채팅창을 영상에 함께 기록합니다.',1240,120);const chatRows=[];for(const m of S.messages.slice(-30)){chatRows.push({text:m.name+' · '+m.time,meta:true});g.font='17px sans-serif';let row='';for(const char of String(m.text)){if(g.measureText(row+char).width>330){chatRows.push({text:row});row=''}row+=char}chatRows.push({text:row});chatRows.push({text:''})}let y=155;for(const row of chatRows.slice(-27)){g.font=row.meta?'14px sans-serif':'17px sans-serif';g.fillStyle=row.meta?'#b3b3bc':'#f5f5f6';g.fillText(row.text,1240,y);y+=26}frame=requestAnimationFrame(draw)}draw();
const sources=[display,S.live].filter(Boolean).filter(s=>s.getAudioTracks().some(t=>t.enabled));if(sources.length){ctx=new AudioContext();await ctx.resume();const dest=ctx.createMediaStreamDestination();sources.forEach(s=>ctx.createMediaStreamSource(new MediaStream(s.getAudioTracks().filter(t=>t.enabled))).connect(dest));audio=dest.stream.getAudioTracks()}output=canvas.captureStream(24);const stream=new MediaStream([...output.getVideoTracks(),...audio]);const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stopDraw=true;cancelAnimationFrame(frame);display.getTracks().forEach(t=>t.stop());output.getTracks().forEach(t=>t.stop());audio.forEach(t=>t.stop());ctx?.close();video.srcObject=null;const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});const record={id:recordingId,ownerId:currentOwner(),reportId:meetingId,title,date:time(),startedAt:started,seconds:Math.round((Date.now()-started)/1000),size:blob.size,url:URL.createObjectURL(blob),overlay:true,persisted:false};S.records.push(record);S.recording=false;S.recorder=null;try{await dbRecord('write',{...record,url:undefined,blob});record.persisted=true}catch{}if(S.security?.id===meetingId&&!S.security.recordIds.includes(recordingId))S.security.recordIds.push(recordingId);const archived=S.reports.find(r=>r.id===meetingId);if(archived&&!archived.recordIds.includes(recordingId))archived.recordIds.push(recordingId);if(archived)persistReports();if(S.page==='meeting')renderMeeting();toast(record.persisted?'위험도 포함 녹화와 탐지 이력을 브라우저에 저장했습니다.':'녹화를 현재 탭에 보관했습니다. 닫기 전에 다운로드하세요.');if(S.afterRecord){const done=S.afterRecord;S.afterRecord=null;done()}};display.getVideoTracks()[0].addEventListener('ended',()=>{if(recorder.state!=='inactive')recorder.stop()});recorder.start(1000);S.recorder=recorder;S.recording=true;closeModal();renderMeeting()}catch{stopDraw=true;cancelAnimationFrame(frame);display?.getTracks().forEach(t=>t.stop());output?.getTracks().forEach(t=>t.stop());audio.forEach(t=>t.stop());ctx?.close();video.srcObject=null;toast('녹화를 시작하지 않았습니다. 지원 브라우저에서 회의 탭을 선택하고 화면 권한을 허용하세요.')}};
records=function(reportId){const rows=reportId?myRecords().filter(r=>r.reportId===reportId):myRecords();modal(`${modalHead('Recordings & evidence','녹화 및 보안 기록')}<p class="note">저장 완료 파일은 같은 브라우저에서 다시 확인할 수 있습니다. 브라우저 데이터 삭제·저장 공간 정책에 따라 사라질 수 있으므로 다운로드를 권장합니다.</p>${rows.length?rows.map(r=>`<div class="record-row"><div class="grow"><strong>${esc(r.title)}</strong><br><small>${r.date} · ${r.seconds}초 · ${(r.size/1024/1024).toFixed(1)} MB</small><div class="chips"><span class="pill ${r.overlay?'safe':'medium'}">${r.overlay?'Risk 표시 포함':'화면 녹화'}</span><span class="pill ${r.persisted?'safe':'medium'}">${r.persisted?'브라우저 저장 완료':'현재 탭만 보관'}</span></div></div><button data-action="play-record-v2" data-id="${r.id}">재생</button><a href="${r.url}" download="SHIELD-${r.id}.webm">다운로드</a><button class="danger" data-action="delete-record" data-id="${r.id}">삭제</button></div>`).join(''):'<div class="empty">실제로 생성한 녹화가 없습니다.<br>호스트로 녹화를 시작하면 영상과 Risk 표시를 함께 저장합니다.</div>'}<div class="modal-footer"><button data-action="archive">탐지 결과 보기</button><button data-action="close">닫기</button></div>`,true)};
function playRecord(id){const r=myRecords().find(r=>r.id===id);if(!r){toast('이 녹화는 현재 브라우저에 없습니다. 다운로드한 파일을 확인하세요.');return}modal(`${modalHead('Risk overlay playback',esc(r.title))}<video id="record-player" controls src="${r.url}" style="width:100%;margin-top:16px"></video><p class="note">${r.overlay?'참가자 Risk·분석 시각을 영상에 합성한 녹화입니다.':'회의 화면 녹화입니다.'} 오디오는 녹화 시 브라우저가 제공한 소스에 한해 포함됩니다.</p><div class="modal-footer">${myReports().some(x=>x.id===r.reportId)?`<button data-action="report" data-id="${r.reportId}">보안 결과</button>`:''}<button data-action="records">보관함</button></div>`,true);}
leave=function(all=false){const finish=()=>{const report=finishSecurity(all);clearInterval(S.timer);S.page='dashboard';stopLocal();S.share?.getTracks().forEach(t=>t.stop());S.share=null;S.network='online';closeModal();dashboard();if(report)showReport(report.id);toast(report?.persisted===false?'브라우저 저장에 실패했습니다. 보안 브라우저 저장 공간을 확인하세요.':'회의를 마쳤습니다. 탐지 이력과 보안 요약을 확인하세요.')};if(S.recording){S.afterRecord=finish;S.recorder.stop()}else finish()};

function handleAccountForm(form,data){S.accounts=load('accounts-v3',S.accounts);const signingUp=form.dataset.signup==='true',identifier=String(data.get('identifier')||'').normalize('NFKC').trim(),email=emailKey(data.get('email')),name=String(data.get('name')||'').normalize('NFKC').trim(),loginId=idKey(data.get('loginId'));const error=t=>{$('#auth-error').textContent=t};if(signingUp){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return error('이메일 형식을 확인하세요.');if(!/^[a-z0-9_-]{3,30}$/.test(loginId))return error('사용자 아이디는 영문·숫자·_·-로 3~30자를 입력하세요.');if(!name||name.length>20)return error('닉네임은 1~20자로 입력하세요.');if(S.accounts.some(a=>emailKey(a.email)===email))return error('이미 사용 중인 이메일입니다.');if(S.accounts.some(a=>idKey(a.loginId)===loginId))return error('이미 사용 중인 사용자 아이디입니다.');const account={id:uid(),email,loginId,name};S.accounts.push(account);save('accounts-v3',S.accounts);switchProfile(account)}else{if(!identifier)return error('이메일 또는 사용자 아이디를 입력하세요.');const account=S.accounts.find(a=>identifier.includes('@')?emailKey(a.email)===emailKey(identifier):idKey(a.loginId)===idKey(identifier));if(!account)return error('이 브라우저에 등록된 이메일 또는 사용자 아이디가 없습니다.');switchProfile(account)}dashboard();toast('데모 계정으로 접속했습니다. 실제 비밀번호 인증은 미연동입니다.')}
function handleProfileForm(data){S.accounts=load('accounts-v3',S.accounts);const name=String(data.get('name')||'').normalize('NFKC').trim(),email=emailKey(data.get('email'));if(!name||name.length>20)return toast('닉네임은 1~20자로 입력하세요.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('이메일 형식을 확인하세요.');if(S.accounts.some(a=>a.id!==currentOwner()&&emailKey(a.email)===email))return toast('이미 사용 중인 이메일입니다.');S.profile={...S.profile,name,email};S.accounts=S.accounts.map(a=>a.id===currentOwner()?{...S.profile}:a);save('accounts-v3',S.accounts);save('profile',S.profile);closeModal();dashboard();toast('프로필을 저장했습니다. 변경한 이메일 또는 기존 사용자 아이디로 로그인할 수 있습니다.')}

function claimParticipation(){const key='active-meeting-'+currentOwner(),active=load(key,{tabs:{}});active.tabs=Object.fromEntries(Object.entries(active.tabs||{}).filter(([,expiry])=>expiry>Date.now()));if(Object.keys(active.tabs).length&&active.meetingId!==S.meeting.id){toast('이미 다른 회의에 참여 중입니다. 한 계정은 한 회의에만 참여할 수 있습니다.');return false}active.meetingId=S.meeting.id;active.tabs[S.tabId]=Date.now()+45000;save(key,active);clearInterval(S.leaseTimer);S.leaseTimer=setInterval(()=>{if(S.page!=='meeting')return;const fresh=load(key,{meetingId:S.meeting.id,tabs:{}});fresh.tabs[S.tabId]=Date.now()+45000;save(key,fresh)},15000);return true}
function releaseParticipation(){clearInterval(S.leaseTimer);try{const key='shield-active-meeting-'+currentOwner(),active=JSON.parse(localStorage.getItem(key)||'null');if(active?.tabs){delete active.tabs[S.tabId];if(Object.keys(active.tabs).length)localStorage.setItem(key,JSON.stringify(active));else localStorage.removeItem(key)}}catch{}}
const enterBeforeV3=enterMeeting;enterMeeting=function(){if(S.closedMeetings.includes(S.meeting.id)){toast('종료된 회의입니다. 초대 링크가 만료되었습니다.');return}if(!claimParticipation())return;S.removedPeople=[];enterBeforeV3()};

const peopleBeforeV3=peoplePanel;peoplePanel=function(){return peopleBeforeV3()+(S.role==='host'&&S.removedPeople.length?`<div class="waiting"><h3>퇴장 후 재입장 요청 체험</h3>${S.removedPeople.map(p=>`<div class="row between" style="margin-top:10px"><span>${esc(p.name)}</span><button data-action="request-rejoin" data-id="${p.id}" style="font-size:10px">다시 입장 요청</button></div>`).join('')}<small>다시 요청한 참가자는 호스트 승인 후 재입장합니다.</small></div>`:'')};

const renderBeforeV3=renderMeeting;renderMeeting=function(){renderBeforeV3();if(S.recording){$('.stage')?.insertAdjacentHTML('afterbegin','<div class="alert recording-notice" role="status"><strong>● 해당 회의는 녹화 중입니다.</strong><small>회의 화면과 채팅이 함께 기록됩니다.</small></div>')}$('.toolbar-note')?.insertAdjacentHTML('beforeend','<div style="margin-top:7px">한 계정은 한 회의에만 참여 · 호스트 나가기 시 전체 종료</div>')};
const infoBeforeV3=info;info=function(meeting=S.meeting){infoBeforeV3(meeting);if(S.closedMeetings.includes(meeting.id)){const start=$('[data-action=start-scheduled]');if(start)start.disabled=true;}$('#invite-link')?.closest('label')?.insertAdjacentHTML('afterend',`<p class="${S.closedMeetings.includes(meeting.id)?'error':'muted'}" style="font-size:11px">${S.closedMeetings.includes(meeting.id)?'종료된 회의 · 초대 링크 만료':'초대 링크는 이 회의가 전체 종료될 때 만료됩니다.'}</p>`)};
const recordsBeforeV3=records;records=function(id){recordsBeforeV3(id);$('.modal .note').textContent='호스트로 생성한 내 녹화 파일을 재생·다운로드·삭제할 수 있습니다. 보안 결과를 삭제해도 녹화는 유지되며, 녹화 삭제도 보안 결과에 영향을 주지 않습니다. 브라우저 저장 데모이며 실제 서버 권한은 미연동입니다.'};
function confirmPersonalDelete(kind,id){const row=(kind==='report'?myReports():myRecords()).find(r=>r.id===id);if(!row)return;modal(`${modalHead('My records','내 기록을 삭제할까요?')}<p>${esc(row.title)}</p><p class="muted" style="font-size:12px">${kind==='report'?'내 보안 결과만 삭제합니다. 녹화 파일은 그대로 남으며 녹화 보관함에서 계속 재생·다운로드할 수 있습니다.':'내 녹화 사본만 삭제하며 보안 결과는 유지합니다.'} 다른 사람의 사본과 이미 다운로드한 파일에는 영향을 주지 않습니다.</p><div class="modal-footer"><button data-action="close">취소</button><button class="danger" data-action="confirm-personal-delete" data-kind="${kind}" data-id="${id}">내 기록 삭제</button></div>`)}
async function deletePersonalRecord(kind,id){
 await S.mediaReady;
 if(kind==='report'){
  const report=myReports().find(r=>r.id===id);if(!report)return;
  const previous=S.reports;S.reports=S.reports.filter(r=>r!==report);
  if(!persistReports()){S.reports=previous;return}
  for(const file of myRecords().filter(r=>r.reportId===id)){
   file.reportId=null;
   if(file.persisted){
    try{const stored=(await dbRecord('read')).find(x=>x.id===file.id);if(stored)await dbRecord('write',{...stored,reportId:null})}
    catch{ /* The recording remains intact; missing report links are hidden. */ }
   }
  }
 }else if(kind==='record'){
  const file=myRecords().find(r=>r.id===id);if(!file)return;
  try{if(file.persisted)await dbRecord('delete',file.id)}
  catch{toast('저장된 파일을 삭제하지 못했습니다. 다시 시도하세요.');return}
  URL.revokeObjectURL(file.url);S.records=S.records.filter(r=>r!==file);
  S.reports.filter(owned).forEach(r=>r.recordIds=r.recordIds.filter(x=>x!==file.id));persistReports();
 }else return;
 closeModal();dashboard();
 toast(kind==='report'?'보안 결과를 삭제했습니다. 녹화 파일은 보관함에 유지됩니다.':'녹화 파일을 삭제했습니다. 보안 결과는 유지됩니다.');
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='request-rejoin'){const p=S.removedPeople.find(p=>p.id===Number(id));if(!p)return;S.waiting.push({...p});S.removedPeople=S.removedPeople.filter(x=>x!==p);renderMeeting();toast('재입장 요청을 보냈습니다. 호스트 승인 후 입장할 수 있습니다.')}else if(a==='delete-report')confirmPersonalDelete('report',id);else if(a==='delete-record')confirmPersonalDelete('record',id);else if(a==='confirm-personal-delete')await deletePersonalRecord(b.dataset.kind,id)});
window.addEventListener('pagehide',releaseParticipation);


// v4: email login and unique nickname invitations; user IDs remain internal stable keys.
function emailKey(value){return String(value||'').normalize('NFKC').trim().toLowerCase()}
function nicknameKey(value){return String(value||'').normalize('NFKC').trim().toLocaleLowerCase('ko-KR')}
function findAccount(value){return S.accounts.find(a=>String(value).includes('@')?emailKey(a.email)===emailKey(value):idKey(a.loginId)===idKey(value))}
function inviteAccount(invite){return typeof invite==='string'?findAccount(invite):S.accounts.find(a=>a.id===invite.userId)}
function inviteLabel(invite){const a=inviteAccount(invite);return a?`${a.name} · ${a.loginId} · ${a.email}`:typeof invite==='string'?invite:`${invite.name||''} · ${invite.email||''}`}
function addInvite(){S.accounts=load('accounts-v3',S.accounts);const input=$('#invite-input'),value=input.value.trim();if(!value)return;const account=findAccount(value);if(!account){toast('이 브라우저에 등록된 회원을 찾지 못했습니다. 예시 회원 또는 가입한 이메일·사용자 아이디를 입력하세요.');return}if(account.id===currentOwner()){toast('호스트 본인은 이미 포함되어 있습니다.');return}if(draft.invites.some(x=>inviteAccount(x)?.id===account.id)){toast('이메일 또는 사용자 아이디로 이미 추가된 회원입니다.');return}draft.invites.push({userId:account.id,email:account.email,name:account.name,status:'invited'});$('#invites').innerHTML=inviteChips();input.value='';toast(`${account.name}님을 초대 목록에 추가했습니다.`)}
S.meetings=load('meetings-v4',[]);
for(const account of [{id:'sample-seoyun',loginId:'seoyun',name:'박서윤',email:'seoyun@example.com'},{id:'sample-jihyun',loginId:'jihyun',name:'이지현',email:'jihyun@example.com'}]){if(!S.accounts.some(a=>a.id===account.id||emailKey(a.email)===emailKey(account.email)||idKey(a.loginId)===idKey(account.loginId)))S.accounts.push({...account,sample:true})}
save('accounts-v3',S.accounts);

function idKey(value){return String(value||'').normalize('NFKC').trim().toLowerCase()}
const assignedIds=new Set();S.accounts=S.accounts.map(a=>{let candidate=idKey(a.loginId)||(a.id==='sample-seoyun'?'seoyun':a.id==='sample-jihyun'?'jihyun':'user-'+a.id.replace(/[^a-z0-9]/gi,'').slice(0,16));let unique=candidate,n=2;while(assignedIds.has(unique))unique=candidate.slice(0,25)+'-'+n++;assignedIds.add(unique);return {...a,loginId:unique}});const currentAccountV5=S.accounts.find(a=>a.id===currentOwner());if(currentAccountV5)S.profile={...currentAccountV5};save('accounts-v3',S.accounts);save('profile',S.profile);

function publishMeeting(m){const copy=JSON.parse(JSON.stringify(m));const i=S.meetings.findIndex(x=>x.id===m.id);if(i<0)S.meetings.push(copy);else S.meetings[i]=copy;save('meetings-v4',S.meetings)}
function meetingById(id){return S.meetings.find(x=>x.id===id)||S.schedules.find(x=>x.id===id)||(id==='secure-review'?{id,title:'제품 보안 검토 회의 · 참여 예시',mic:true,camera:true,waiting:true,access:'링크가 있는 사람',invites:[],example:true}:null)}
function hasInvitation(m){return (m.invites||[]).some(x=>inviteAccount(x)?.id===currentOwner())}
function refreshMeetings(){S.meetings=load('meetings-v4',S.meetings);S.closedMeetings=load('closed-meetings-v3',S.closedMeetings)}
const dashboardV4Base=dashboard;dashboard=function(){refreshMeetings();dashboardV4Base();const invitations=S.meetings.filter(m=>m.ownerId!==currentOwner()&&hasInvitation(m));$('.hero')?.insertAdjacentHTML('afterend',`<section class="invitation-section"><div class="section-title"><h2>받은 초대 <small> / ${invitations.length}</small></h2><button class="ghost" data-action="refresh-invitations" style="font-size:11px">새로고침</button></div>${invitations.length?invitations.map(m=>{const ended=S.closedMeetings.includes(m.id),host=S.accounts.find(a=>a.id===m.ownerId);return `<div class="panel invitation-card row between wrap"><div><span class="pill ${ended?'medium':'safe'}">${ended?'종료됨 · 링크 만료':'초대받은 회의'}</span><h3>${esc(m.title)}</h3><small>${esc(host?.name||'호스트')}님의 초대 · ${m.date?esc(m.date.replace('T',' · '))+' KST':'즉시 회의'} · ${m.waiting?'입장 승인 필요':'대기실 미사용'}</small></div><button class="primary" data-action="join-invited" data-id="${esc(m.id)}" ${ended?'disabled':''}>장치 확인 후 참여</button></div>`}).join(''):'<div class="panel empty">아직 받은 초대가 없습니다.<br><small>다른 회원이 내 이메일 또는 사용자 아이디로 초대하면 이곳에 표시됩니다.</small></div>'}</section>`)};
const preflightV4Base=preflight;preflight=function(m,role){refreshMeetings();if(S.closedMeetings.includes(m.id)){toast('종료된 회의입니다. 초대 링크가 만료되었습니다.');return}if(m.ownerId===currentOwner())role='host';if(role==='host'&&m.ownerId&&m.ownerId!==currentOwner()){toast('회의를 시작할 수 있는 권한이 없습니다.');return}if(role==='guest'&&m.access==='초대받은 사람만'&&!hasInvitation(m)){toast('초대받은 계정만 참여할 수 있는 회의입니다. 이메일 또는 사용자 아이디 초대를 먼저 확인하세요.');return}preflightV4Base(m,role)};
const enterV4Base=enterMeeting;enterMeeting=function(){refreshMeetings();if(S.closedMeetings.includes(S.meeting.id)){toast('종료된 회의의 초대 링크는 만료되었습니다.');return}if(S.role==='guest'&&S.meeting.access==='초대받은 사람만'&&!hasInvitation(S.meeting)){toast('초대받은 계정만 입장할 수 있습니다.');return}enterV4Base();if(S.page==='meeting'&&S.security?.meetingId===S.meeting.id){if(S.role==='host')publishMeeting(S.meeting);else if(!S.meeting.example){S.meeting.invites=S.meeting.invites.map(x=>inviteAccount(x)?.id===currentOwner()?{...(typeof x==='string'?{userId:currentOwner(),name:S.profile.name,email:S.profile.email}:x),status:'accepted'}:x);publishMeeting(S.meeting)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='join-invited'){const m=meetingById(b.dataset.id);if(m)preflight(m,'guest')}else if(b.dataset.action==='refresh-invitations')dashboard()});
window.addEventListener('storage',e=>{if(e.key==='shield-accounts-v3')S.accounts=load('accounts-v3',S.accounts);if(e.key==='shield-closed-meetings-v3'){refreshMeetings();if(S.page==='meeting'&&S.closedMeetings.includes(S.meeting.id)){toast('호스트가 회의를 종료했습니다. 종료 결과를 확인하세요.');leave(false);return}}if(S.page==='dashboard'&&['shield-meetings-v4','shield-closed-meetings-v3'].includes(e.key)&&!$('.modal'))dashboard()});


function showWaiting(){modalClose=null;S.mic=$('#pre-mic')?.checked??S.mic;S.camera=$('#pre-camera')?.checked??S.camera;S.pendingEntry={meetingId:S.meeting.id,status:'pending'};modal(`${modalHead('Waiting room','호스트의 승인을 기다리고 있습니다.')}<div class="waiting-screen" role="status"><span class="waiting-spinner" aria-hidden="true"></span><strong>${esc(S.meeting.title)}</strong><p>${esc(S.profile.name)}님, 입장 요청을 보냈습니다.<br>호스트가 승인하면 회의에 입장합니다.</p></div><div class="modal-footer"><button data-action="close">입장 요청 취소</button></div><details class="demo-wait-controls"><summary>데모 상태 체험</summary><p class="note">실제 호스트와 연결하지 않은 화면 체험입니다.</p><div class="row wrap"><button data-action="simulate-approval">호스트 승인</button><button data-action="simulate-rejection">입장 거절</button><button data-action="simulate-wait-end">회의 종료</button></div></details>`,false,()=>{if(S.pendingEntry?.status==='pending')S.pendingEntry.status='cancelled';if(S.page!=='meeting')stopLocal()})}
function approveWaiting(){if(S.pendingEntry?.status!=='pending')return;refreshMeetings();if(S.closedMeetings.includes(S.meeting.id)){finishWaiting('ended');return}const request=S.pendingEntry;modalClose=null;enterMeeting();request.status=S.page==='meeting'?'approved':'cancelled';if(S.page!=='meeting'){closeModal();stopLocal()}}
function finishWaiting(kind){if(S.pendingEntry?.status!=='pending')return;S.pendingEntry.status=kind;modalClose=null;stopLocal();if(kind==='ended'){if(!S.closedMeetings.includes(S.meeting.id)){S.closedMeetings.push(S.meeting.id);save('closed-meetings-v3',S.closedMeetings)}}modal(`${modalHead('Entry status',kind==='ended'?'회의가 종료되었습니다.':'입장 요청이 승인되지 않았습니다.')}<div class="empty">${kind==='ended'?'승인을 기다리는 동안 회의가 종료되어 입장할 수 없습니다.':'호스트가 입장 요청을 거절했습니다. 필요한 경우 다시 요청할 수 있습니다.'}</div><div class="modal-footer">${kind==='rejected'?'<button data-action="retry-entry">다시 입장 요청</button>':''}<button class="primary" data-action="waiting-home">홈으로</button></div>`)}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='simulate-rejection')finishWaiting('rejected');else if(action==='simulate-wait-end')finishWaiting('ended');else if(action==='waiting-home'){closeModal();dashboard()}else if(action==='retry-entry'){S.pendingEntry=null;preflight(S.meeting,'guest')}});
window.addEventListener('storage',e=>{if(e.key==='shield-closed-meetings-v3'&&S.pendingEntry?.status==='pending'){refreshMeetings();if(S.closedMeetings.includes(S.pendingEntry.meetingId))finishWaiting('ended')}});

login();
